
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estrellas de Belén 2026 | Asistencia</title>

<style>
:root {
  --morado: #51236f;
  --dorado: #d7ad55;
  --fondo: #f7f4fa;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 18px;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--fondo);
  color: #292333;
}
main { max-width: 560px; margin: auto; }
.card {
  background: white;
  padding: 22px;
  border-radius: 18px;
  box-shadow: 0 8px 28px #25113718;
}
h1 {
  color: var(--morado);
  text-align: center;
  font-size: 25px;
}
.sub { text-align: center; color: #65596e; }
label {
  display: block;
  font-weight: bold;
  margin: 18px 0 8px;
}
input, select, button {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  font-size: 16px;
}
input, select {
  border: 1px solid #cfc5d8;
  background: white;
}
button {
  border: 0;
  font-weight: bold;
  cursor: pointer;
  margin-top: 12px;
}
button:disabled { opacity: .6; cursor: wait; }
.primary { background: var(--morado); color: white; }
.secondary { background: #eee8f3; color: var(--morado); }
#reader { width: 100%; margin-top: 16px; overflow: hidden; }
#resultado {
  display: none;
  margin-top: 16px;
  padding: 15px;
  border-radius: 10px;
  line-height: 1.5;
  white-space: pre-line;
  overflow-wrap: anywhere;
}
#resultado.ok { display: block; background: #e5f5e9; color: #145b2b; }
#resultado.error { display: block; background: #fdeaea; color: #8b2020; }
#resultado.info { display: block; background: #eee8f8; color: #482365; }
.small { font-size: 13px; color: #65596e; line-height: 1.5; }
.status { text-align: center; color: #65596e; font-size: 14px; }
.hidden { display: none !important; }
#loginMensaje { color: #8b2020; font-size: 14px; }
</style>
</head>

<body>
<main>
<section class="card">
  <h1>⭐ Estrellas de Belén 2026</h1>
  <p class="sub">Sistema de control de asistencia</p>

  <!-- ACCESO PARA ENCARGADOS -->
  <div id="loginBox">
    <label for="contrasena">Contraseña de encargado</label>
    <input
      id="contrasena"
      type="password"
      autocomplete="current-password"
      placeholder="Escribe la contraseña"
    >
    <button id="btnAcceder" class="primary" type="button">
      Entrar al escáner
    </button>
    <p id="loginMensaje" role="status" aria-live="polite"></p>
    <p class="small">
      Solo los encargados autorizados deben utilizar este sistema.
    </p>
  </div>

  <!-- ESCÁNER PROTEGIDO -->
  <div id="panelEscaner" class="hidden">
    <label for="encuentro">Selecciona el encuentro</label>
    <select id="encuentro">
      <option value="">Inicia sesión para cargar encuentros</option>
    </select>

    <p class="small">
      Comprueba que seleccionaste el encuentro correcto antes de escanear.
    </p>

    <button id="iniciar" class="primary" type="button">
      Activar cámara y escanear
    </button>
    <button id="detener" class="secondary hidden" type="button">
      Detener cámara
    </button>
    <button id="cerrarSesion" class="secondary" type="button">
      Cerrar sesión
    </button>

    <div id="reader"></div>
    <div id="resultado" role="status" aria-live="polite"></div>
    <p id="estado" class="status"></p>
  </div>
</section>
</main>

<script>
'use strict';

/* CONFIGURACIÓN DE TU APLICACIÓN */
const URL_APPS_SCRIPT =
'https://script.google.com/macros/s/AKfycby1xFXvat_6bomh1WuZbyul7lopjVazq-8NmjePUpAOooxLa_qRxZ88cp585j5N2BrAtA/exec';

/*
  La contraseña NO se guarda en este HTML.
  Se valida con CONFIG.CLAVE del Apps Script.
*/
let claveActual = '';

const selector = document.getElementById('encuentro');
const loginBox = document.getElementById('loginBox');
const panelEscaner = document.getElementById('panelEscaner');
const inputContrasena = document.getElementById('contrasena');
const btnAcceder = document.getElementById('btnAcceder');
const loginMensaje = document.getElementById('loginMensaje');
const btnCerrarSesion = document.getElementById('cerrarSesion');
const botonIniciar = document.getElementById('iniciar');
const botonDetener = document.getElementById('detener');
const resultado = document.getElementById('resultado');
const estado = document.getElementById('estado');

let lector = null;
let procesando = false;
let ultimoCodigo = '';
let ultimoTiempo = 0;

/* CARGA DEL LECTOR QR DESDE DOS SERVIDORES */
function cargarLibreriaQR() {
  return new Promise((resolve, reject) => {
    if (window.Html5Qrcode) {
      resolve();
      return;
    }

    const fuentes = [
      'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js',
      'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js'
    ];

    let indice = 0;

    function intentar() {
      if (window.Html5Qrcode) {
        resolve();
        return;
      }

      if (indice >= fuentes.length) {
        reject(new Error(
          'No se pudo cargar el lector QR. Comprueba tu conexión a internet.'
        ));
        return;
      }

      const script = document.createElement('script');
      script.src = fuentes[indice++];
      script.onload = () => {
        if (window.Html5Qrcode) resolve();
        else intentar();
      };
      script.onerror = intentar;
      document.head.appendChild(script);
    }

    intentar();
  });
}

/* MENSAJES */
function mostrar(tipo, mensaje) {
  resultado.className = tipo;
  resultado.textContent = mensaje;
}

function escapar(valor) {
  return String(valor == null ? '' : valor);
}

/* CONSULTA SEGURA DEL ENDPOINT MEDIANTE JSONP */
function pedirAPI(parametros, clave = claveActual) {
  return new Promise((resolve, reject) => {
    const callback = 'respuestaQR_' +
      Date.now() + '_' + Math.floor(Math.random() * 100000);

    const script = document.createElement('script');
    let terminado = false;

    const temporizador = setTimeout(() => {
      terminar(new Error(
        'Tiempo agotado. Comprueba tu conexión y la implementación de Apps Script.'
      ));
    }, 20000);

    function terminar(error, datos) {
      if (terminado) return;
      terminado = true;
      clearTimeout(temporizador);

      try {
        delete window[callback];
      } catch (_) {
        window[callback] = undefined;
      }

      if (script.parentNode) script.parentNode.removeChild(script);

      if (error) reject(error);
      else resolve(datos);
    }

    window[callback] = datos => terminar(null, datos);

    const consulta = new URLSearchParams({
      ...parametros,
      clave: clave,
      callback: callback,
      _: Date.now()
    });

    script.onerror = () => terminar(new Error(
      'No se pudo conectar con Apps Script. Verifica que esté implementado como aplicación web.'
    ));

    script.src = URL_APPS_SCRIPT + '?' + consulta.toString();
    document.body.appendChild(script);
  });
}

/* VALIDAR CONTRASEÑA CON EL SERVIDOR */
async function iniciarSesion() {
  const clave = inputContrasena.value;

  if (!clave) {
    loginMensaje.textContent = 'Escribe la contraseña.';
    return;
  }

  btnAcceder.disabled = true;
  loginMensaje.textContent = 'Verificando acceso...';

  try {
    const datos = await pedirAPI(
      { codigo: '__VERIFICAR_ACCESO__' },
      clave
    );

    if (datos.estado !== 'OK') {
      throw new Error(datos.mensaje || 'Contraseña incorrecta.');
    }

    claveActual = clave;
    inputContrasena.value = '';
    loginMensaje.textContent = '';
    loginBox.classList.add('hidden');
    panelEscaner.classList.remove('hidden');

    await cargarEncuentros();

  } catch (error) {
    claveActual = '';
    loginMensaje.textContent =
      error.message || 'No se pudo validar el acceso.';
  } finally {
    btnAcceder.disabled = false;
  }
}

/* CARGAR ENCUENTROS DISPONIBLES */
async function cargarEncuentros() {
  try {
    const datos = await pedirAPI({ accion: 'encuentros' });

    if (datos.estado !== 'OK') {
      throw new Error(
        datos.mensaje || 'No se pudieron cargar los encuentros.'
      );
    }

    selector.innerHTML =
      '<option value="">— Selecciona un encuentro —</option>';

    (datos.encuentros || []).forEach(e => {
      const opcion = document.createElement('option');
      opcion.value = e.id;
      opcion.textContent =
        e.id + ' · ' + e.nombre +
        (e.fecha ? ' · ' + e.fecha : '') +
        ' · ' + e.estado;

      selector.appendChild(opcion);
    });

    estado.textContent =
      'Acceso autorizado. Selecciona el encuentro.';

  } catch (error) {
    selector.innerHTML =
      '<option value="">Error al cargar encuentros</option>';

    estado.textContent = error.message;
    mostrar('error', error.message);
  }
}

/* EXTRAER EL IDENTIFICADOR DEL QR */
function extraerCodigo(valor) {
  const contenido = String(valor || '').trim();

  try {
    if (/^https?:\/\//i.test(contenido)) {
      const url = new URL(contenido);
      const codigo =
        url.searchParams.get('codigo') ||
        url.searchParams.get('qr') ||
        url.searchParams.get('id');

      if (codigo) return codigo.trim();
    }
  } catch (_) {}

  return contenido;
}

/* REGISTRAR ASISTENCIA */
async function registrarCodigo(valor) {
  const codigo = extraerCodigo(valor);
  const ahora = Date.now();

  if (!codigo || procesando ||
      (codigo === ultimoCodigo && ahora - ultimoTiempo < 4000)) {
    return;
  }

  procesando = true;
  ultimoCodigo = codigo;
  ultimoTiempo = ahora;

  try {
    if (!claveActual) {
      throw new Error('La sesión no está autorizada. Inicia sesión nuevamente.');
    }

    if (!selector.value) {
      throw new Error('Selecciona primero un encuentro.');
    }

    estado.textContent = 'Verificando código QR...';

    const datos = await pedirAPI({
      codigo: codigo,
      encuentro: selector.value
    });

    const persona = [
      datos.nombres,
      datos.apellidos
    ].filter(Boolean).map(escapar).join(' ');

    const encuentro = escapar(datos.encuentro || selector.value);

    if (datos.estado === 'OK') {
      mostrar('ok',
        '✓ ASISTENCIA REGISTRADA\n' +
        (persona || 'Participante') + '\n' +
        'Encuentro: ' + encuentro + '\n' +
        'Fecha: ' + escapar(datos.fecha || '') + ' ' +
        escapar(datos.hora || '') + '\n' +
        escapar(datos.mensaje || '')
      );

      estado.textContent = 'Registro completado.';

    } else if (datos.estado === 'DUPLICADO') {
      mostrar('info',
        '⚠ ASISTENCIA YA REGISTRADA\n' +
        (persona || 'Participante') + '\n' +
        'Encuentro: ' + encuentro + '\n' +
        escapar(datos.mensaje || '')
      );

      estado.textContent = 'No se añadió una asistencia duplicada.';

    } else {
      mostrar('error',
        '✕ NO SE REGISTRÓ\n' +
        escapar(datos.mensaje || 'Código QR no válido.')
      );

      estado.textContent = 'Revisa el mensaje antes de continuar.';
    }

  } catch (error) {
    mostrar('error', 'ERROR: ' + escapar(error.message || error));
    estado.textContent = 'No se pudo completar el registro.';
  } finally {
    setTimeout(() => {
      procesando = false;
    }, 1200);
  }
}

/* ACTIVAR CÁMARA */
async function iniciarCamara() {
  if (!claveActual) {
    mostrar('error', 'Inicia sesión para utilizar el escáner.');
    return;
  }

  if (!selector.value) {
    mostrar('error', 'Primero selecciona un encuentro.');
    return;
  }

  botonIniciar.disabled = true;
  estado.textContent = 'Cargando lector QR...';

  try {
    await cargarLibreriaQR();

    lector = new Html5Qrcode('reader');

    await lector.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 250, height: 250 } },
      registrarCodigo,
      () => {}
    );

    botonIniciar.classList.add('hidden');
    botonDetener.classList.remove('hidden');

    estado.textContent =
      'Cámara activa. Apunta al QR del participante.';

  } catch (error) {
    if (lector) {
      try {
        if (lector.isScanning) await lector.stop();
        await lector.clear();
      } catch (_) {}
      lector = null;
    }

    mostrar('error',
      'No se pudo iniciar el escáner. ' +
      escapar(error.message || error) +
      ' Verifica el HTTPS y el permiso de cámara.'
    );

    estado.textContent = 'No se pudo activar la cámara.';

  } finally {
    botonIniciar.disabled = false;
  }
}

/* DETENER CÁMARA */
async function detenerCamara() {
  if (lector) {
    try {
      if (lector.isScanning) await lector.stop();
      await lector.clear();
    } catch (_) {}

    lector = null;
  }

  botonIniciar.classList.remove('hidden');
  botonDetener.classList.add('hidden');
  estado.textContent = 'Cámara detenida.';
}

/* CERRAR SESIÓN */
async function cerrarSesion() {
  await detenerCamara();

  claveActual = '';
  selector.innerHTML =
    '<option value="">Inicia sesión para cargar encuentros</option>';

  panelEscaner.classList.add('hidden');
  loginBox.classList.remove('hidden');
  loginMensaje.textContent = 'Sesión cerrada.';
  estado.textContent = '';
  resultado.className = '';
  resultado.textContent = '';
  inputContrasena.value = '';
}

/* EVENTOS */
btnAcceder.addEventListener('click', iniciarSesion);

inputContrasena.addEventListener('keydown', evento => {
  if (evento.key === 'Enter') iniciarSesion();
});

botonIniciar.addEventListener('click', iniciarCamara);
botonDetener.addEventListener('click', detenerCamara);
btnCerrarSesion.addEventListener('click', cerrarSesion);
</script>
</body>
</html>
