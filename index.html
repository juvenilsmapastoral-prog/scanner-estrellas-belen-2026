
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estrellas de Belén 2026 - Escáner QR</title>

<style>
:root {
  --morado: #51236f;
  --dorado: #d7ad55;
  --fondo: #f7f4fa;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 18px;
  background: var(--fondo);
  color: #292333;
  font-family: Arial, sans-serif;
}
main { max-width: 560px; margin: auto; }
.card {
  background: white;
  padding: 22px;
  border-radius: 18px;
  box-shadow: 0 8px 28px #25113718;
}
h1 { color: var(--morado); text-align: center; font-size: 25px; }
.sub { text-align: center; color: #65596e; }
label { display: block; font-weight: bold; margin: 18px 0 8px; }
select, button {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  border-radius: 10px;
}
select { border: 1px solid #ccc; background: white; }
button { border: 0; font-weight: bold; cursor: pointer; margin-top: 12px; }
.primary { background: var(--morado); color: white; }
.secondary { background: #eee8f3; color: var(--morado); }
button:disabled { opacity: .6; }
#reader { width: 100%; margin-top: 16px; overflow: hidden; }
#resultado {
  display: none;
  margin-top: 16px;
  padding: 15px;
  border-radius: 10px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
#resultado.ok { display: block; background: #e5f5e9; color: #145b2b; }
#resultado.error { display: block; background: #fdeaea; color: #8b2020; }
#resultado.info { display: block; background: #eee8f8; color: #482365; }
#estado { text-align: center; color: #65596e; font-size: 14px; }
.small { font-size: 13px; color: #65596e; line-height: 1.5; }
.hidden { display: none !important; }
</style>
</head>

<body>
<main>
<section class="card">
  <h1>⭐ Estrellas de Belén 2026</h1>
  <p class="sub">Control de asistencia mediante QR</p>

  <label for="encuentro">Selecciona el encuentro</label>
  <select id="encuentro">
    <option value="">Cargando encuentros...</option>
  </select>

  <p class="small">Comprueba que el encuentro seleccionado sea el correcto antes de escanear.</p>

  <button id="iniciar" class="primary">Activar cámara y escanear</button>
  <button id="detener" class="secondary hidden">Detener cámara</button>

  <div id="reader"></div>
  <div id="resultado" role="status" aria-live="polite"></div>
  <p id="estado">Conectando con el sistema...</p>
</section>
</main>

<script>
/* CONFIGURACIÓN */
const URL_APPS_SCRIPT =
'https://script.google.com/macros/s/AKfycby1xFXvat_6bomh1WuZbyul7lopjVazq-8NmjePUpAOooxLa_qRxZ88cp585j5N2BrAtA/exec';

const CLAVE_SISTEMA = 'ESTRELLAS_2026$';

const selector = document.getElementById('encuentro');
const btnIniciar = document.getElementById('iniciar');
const btnDetener = document.getElementById('detener');
const resultado = document.getElementById('resultado');
const estado = document.getElementById('estado');

let lector = null;
let procesando = false;
let ultimoCodigo = '';
let ultimoTiempo = 0;

/* CARGAR LIBRERÍA DESDE DOS SERVIDORES */
function cargarLibreria() {
  return new Promise((resolve, reject) => {
    if (window.Html5Qrcode) {
      resolve();
      return;
    }

    const fuentes = [
      'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js'
    ];

    let indice = 0;

    function intentar() {
      if (window.Html5Qrcode) {
        resolve();
        return;
      }

      if (indice >= fuentes.length) {
        reject(new Error(
          'No se pudo cargar la librería QR. Comprueba tu conexión o prueba otra red.'
        ));
        return;
      }

      const script = document.createElement('script');
      script.src = fuentes[indice++];
      script.onload = () => {
        if (window.Html5Qrcode) resolve();
        else intentar();
      };
      script.onerror = intentar;
      document.head.appendChild(script);
    }

    intentar();
  });
}

function mostrar(tipo, mensaje) {
  resultado.className = tipo;
  resultado.textContent = mensaje;
}

function escapar(valor) {
  return String(valor == null ? '' : valor);
}

/* COMUNICACIÓN CON APPS SCRIPT MEDIANTE JSONP */
function pedirAPI(parametros) {
  return new Promise((resolve, reject) => {
    const callback = 'respuestaQR_' + Date.now() +
      '_' + Math.floor(Math.random() * 100000);
    const script = document.createElement('script');
    let terminado = false;

    const temporizador = setTimeout(() => {
      terminar(new Error('Tiempo de espera agotado al conectar con Apps Script.'));
    }, 20000);

    function terminar(error, datos) {
      if (terminado) return;
      terminado = true;
      clearTimeout(temporizador);
      try { delete window[callback]; } catch (_) {}
      script.remove();
      if (error) reject(error);
      else resolve(datos);
    }

    window[callback] = datos => terminar(null, datos);
    script.onerror = () => terminar(new Error(
      'Error al conectar con Apps Script. Comprueba la implementación web.'
    ));

    const consulta = new URLSearchParams({
      ...parametros,
      clave: CLAVE_SISTEMA,
      callback,
      _: Date.now()
    });

    script.src = URL_APPS_SCRIPT + '?' + consulta.toString();
    document.body.appendChild(script);
  });
}

/* LISTA DE ENCUENTROS */
async function cargarEncuentros() {
  try {
    const datos = await pedirAPI({ accion: 'encuentros' });

    if (datos.estado !== 'OK') {
      throw new Error(datos.mensaje || 'No se pudieron cargar los encuentros.');
    }

    selector.innerHTML = '<option value="">— Selecciona un encuentro —</option>';

    (datos.encuentros || []).forEach(e => {
      const opcion = document.createElement('option');
      opcion.value = e.id;
      opcion.textContent =
        e.id + ' · ' + e.nombre +
        (e.fecha ? ' · ' + e.fecha : '') +
        ' · ' + e.estado;
      selector.appendChild(opcion);
    });

    estado.textContent = 'Conectado. Selecciona un encuentro.';

  } catch (error) {
    selector.innerHTML = '<option value="">Error al cargar encuentros</option>';
    estado.textContent = error.message;
    mostrar('error', error.message);
  }
}

/* EXTRAER CÓDIGO QR */
function extraerCodigo(valor) {
  const contenido = String(valor || '').trim();

  try {
    if (/^https?:\/\//i.test(contenido)) {
      const url = new URL(contenido);
      const codigo = url.searchParams.get('codigo') ||
        url.searchParams.get('qr') ||
        url.searchParams.get('id');

      if (codigo) return codigo.trim();
    }
  } catch (_) {}

  return contenido;
}

/* REGISTRAR ASISTENCIA */
async function registrarCodigo(valor) {
  const codigo = extraerCodigo(valor);
  const ahora = Date.now();

  if (!codigo || procesando ||
      (codigo === ultimoCodigo && ahora - ultimoTiempo < 4000)) return;

  procesando = true;
  ultimoCodigo = codigo;
  ultimoTiempo = ahora;

  try {
    if (!selector.value) {
      throw new Error('Selecciona primero un encuentro.');
    }

    estado.textContent = 'Verificando QR...';

    const datos = await pedirAPI({
      codigo,
      encuentro: selector.value
    });

    const persona = [datos.nombres, datos.apellidos]
      .filter(Boolean).map(escapar).join(' ');

    if (datos.estado === 'OK') {
      mostrar('ok',
        '✓ ASISTENCIA REGISTRADA\n' +
        (persona || 'Participante') + '\n' +
        'Encuentro: ' + escapar(datos.encuentro || selector.value) + '\n' +
        'Fecha: ' + escapar(datos.fecha || '') + ' ' +
        escapar(datos.hora || '') + '\n' +
        escapar(datos.mensaje || '')
      );
      estado.textContent = 'Registro completado.';

    } else if (datos.estado === 'DUPLICADO') {
      mostrar('info',
        '⚠ ASISTENCIA YA REGISTRADA\n' +
        (persona || 'Participante') + '\n' +
        'Encuentro: ' + escapar(datos.encuentro || selector.value) + '\n' +
        escapar(datos.mensaje || '')
      );
      estado.textContent = 'No se añadió una asistencia duplicada.';

    } else {
      mostrar('error',
        '✕ NO SE REGISTRÓ\n' +
        escapar(datos.mensaje || 'Código QR no válido.')
      );
      estado.textContent = 'Revisa el mensaje.';
    }

  } catch (error) {
    mostrar('error', '✕ ERROR\n' + escapar(error.message || error));
    estado.textContent = 'No se pudo completar el registro.';
  } finally {
    setTimeout(() => { procesando = false; }, 1200);
  }
}

/* CÁMARA */
async function iniciarCamara() {
  if (!selector.value) {
    mostrar('error', 'Primero selecciona un encuentro.');
    return;
  }

  btnIniciar.disabled = true;

  try {
    await cargarLibreria();

    lector = new Html5Qrcode('reader');

    await lector.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 250, height: 250 } },
      registrarCodigo,
      () => {}
    );

    btnIniciar.classList.add('hidden');
    btnDetener.classList.remove('hidden');
    estado.textContent = 'Cámara activa. Apunta al QR del participante.';

  } catch (error) {
    if (lector) {
      try { await lector.clear(); } catch (_) {}
      lector = null;
    }

    mostrar('error',
      'No se pudo iniciar el escáner. ' +
      escapar(error.message || error) +
      ' Verifica que la página use HTTPS y que hayas permitido la cámara.'
    );
    estado.textContent = 'No se pudo activar la cámara.';
  } finally {
    btnIniciar.disabled = false;
  }
}

async function detenerCamara() {
  if (lector) {
    try {
      if (lector.isScanning) await lector.stop();
      await lector.clear();
    } catch (_) {}
    lector = null;
  }

  btnIniciar.classList.remove('hidden');
  btnDetener.classList.add('hidden');
  estado.textContent = 'Cámara detenida.';
}

btnIniciar.addEventListener('click', iniciarCamara);
btnDetener.addEventListener('click', detenerCamara);

cargarEncuentros();
</script>
</body>
</html>
